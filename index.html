<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>G-line | Turnos</title>
    <link rel="stylesheet" href="web.css">
</head>
<body>
    <div class="app-shell">
        <aside class="sidebar">
            <div class="sidebar-brand">
                           </div>
            <nav class="navbar">
                <button class="nav-btn active" onclick="showSection('inicio', this)" aria-label="Inicio">
                    <span class="home-square" aria-hidden="true">🏠</span>
                </button>
                <button class="nav-btn" onclick="showSection('turnos', this)">Turnos</button>
                <button class="nav-btn" onclick="showSection('eventos', this)">Eventos</button>
                <button class="nav-btn" onclick="showSection('imagen', this)">Subir Imagen</button>
                <button class="nav-btn" onclick="showSection('pago', this)">Formas de Pago</button>
            </nav>
        </aside>

        <div class="dashboard">
            <header class="header">
                <h1>G-line</h1>
            </header>

            <main class="content">
                <div class="content-wrapper">
                <div class="left-section">
                    <section id="imagen" class="section">
                        <h2>Subir Imagen</h2>
                        <div class="upload-box">
                            <input type="file" id="fileInput" class="file-input" accept="image/*">
                            <label for="fileInput" class="file-label">
                                <span>📁 Subí una imagen para ver el diseño antes del turno</span>
                            </label>
                            <button class="action-btn" id="uploadBtn" type="button">Cargar Diseño</button>
                        </div>
                        <div class="preview-box">
                            <p>Vista previa:</p>
                            <img id="preview" alt="Previsualización" style="max-width: 240px; margin-top: 10px;">
                        </div>
                    </section>
                </div>

                <div class="right-section">
                    <section id="inicio" class="section active">
                        <div class="welcome-box">
                            <p>Creá tu cuenta para reservar tu turno de uñas.</p>
                            <div class="auth-card">
                                <h3>Registrate</h3>
                                <button class="auth-btn" data-method="correo">📧 Crear cuenta con correo</button>
                                <button class="auth-btn" data-method="facebook">📘 Continuar con Facebook</button>
                                <button class="auth-btn" data-method="telefono">📱 Continuar con número de teléfono</button>

                                <div class="form-group">
                                    <label for="email">Correo</label>
                                    <input type="email" id="email" class="input-field" placeholder="tuGmail@email.com">
                                </div>
                                <div class="form-group">
                                    <label for="password">Contraseña</label>
                                    <input type="password" id="password" class="input-field" placeholder="Min. 6 caracteres">
                                </div>
                                <button class="action-btn" id="registerBtn">Crear cuenta</button>
                                <div class="divider" style="margin: 15px 0; text-align: center; color: #999;">O</div>
                                <button class="action-btn" id="loginGoogle" style="background-color: #DB4437;">🔐 Continuar con Google</button>
                                <button class="action-btn" id="loginFacebook" style="background-color: #1877F2;">📘 Continuar con Facebook</button>
                                <button class="action-btn" id="logoutBtn" style="background-color: #FF6B6B; display: none;">Cerrar sesión</button>
                            </div>
                        </div>
                    </section>

                    <section id="turnos" class="section">
                        <h2>Turnos</h2>
                        <div class="calendar-container">
                            <div class="calendar-header">
                                <button class="calendar-nav" id="prevMonth" type="button">&lt;</button>
                                <h3 id="monthYear"></h3>
                                <button class="calendar-nav" id="nextMonth" type="button">&gt;</button>
                            </div>
                            <div class="calendar-grid" id="calendar"></div>
                        </div>

                        <div class="horarios-container" id="horariosContainer" style="display:none;">
                            <h3 id="horariosTitle">Horarios disponibles</h3>
                            <div class="form-group">
                                <label for="servicioSelect">Servicio</label>
                                <select id="servicioSelect" class="input-field">
                                    <option value="">Seleccioná un servicio</option>
                                    <option value="Semipermanente">Semipermanente</option>
                                    <option value="Softgel">Softgel</option>
                                    <option value="Capping">Capping</option>
                                    <option value="Esculpidas en gel">Esculpidas en gel</option>
                                    <option value="Esculpidas en acrílico">Esculpidas en acrílico</option>
                                </select>
                            </div>
                            <div class="horarios-grid" id="horariosGrid"></div>
                            <div class="extra-box">
                            </div>
                            <button class="action-btn" id="confirmarTurno" type="button">Confirmar Turno</button>
                        </div>
                    </section>

                    <section id="eventos" class="section">
                        <h2>Eventos</h2>
                        <div class="events-grid">
                            <article class="event-card">
                                <span class="event-tag">Próximo</span>
                                <h3>Workshop de uñas artísticas</h3>
                                <p>Aprendé técnicas nuevas, diseños modernos y tips para llevar tu estilo al siguiente nivel.</p>
                                <div class="event-meta">
                                    <span>📅 28 de julio</span>
                                    <span>🕒 18:00 hs</span>
                                </div>
                                <button class="action-btn event-btn" type="button">Reservar mi lugar</button>
                            </article>
                        </div>
                    </section>
                </div>
            </main>
        </div>
    </div>

    <script type="module" src="web.js"></script>
</body>
</html>
